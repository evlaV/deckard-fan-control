# YAML config file for juputer-fan-control.service

fast_loop_interval: 1 # 1 hz
slow_loop_interval: 5
control_loop_ratio: 1
# log_write_ratio: 60 # uncomment to reduce disk writes
log_write_ratio: 1

base_hwmon_path: /sys/class/hwmon/
charge_state_path: none # disabled on deckard

fan_hwmon_name: slg4ax46073v
fan_min_speed: 30
fan_threshold_speed: 0
fan_max_speed: 55
fan_min_time_on: 90
fan_gain: 10
fan_rpm_scale: 2 # delta fan tach is 2 periods for 1 revolution
ec_ramp_rate: 10

fan_hysteresis: 20

# We set all the fan control devices with the same curve,
# so that there isn't a discountinous jump when we switch
# the fan control source
# you can use the line below in wolfram alpha to define a curve


# keith curve
# quadratic fit (40,25)(70,35)(80,40)(90,45)
# linear fit (1,0),(10,.3)

# A_quad_control: &A_quad_control 0.00318
# B_quad_control: &B_quad_control -0.0110
# C_quad_control: &C_quad_control 20.345

# testing new curve
A_quad_control: &A_quad_control 0.00762431
B_quad_control: &B_quad_control -0.526519
C_quad_control: &C_quad_control 28.8287
# quadratic fit (40,20)(70,29)(80,36)(90,43)

A_ff_control: &A_ff_control 1.42859
B_ff_control: &B_ff_control -1
# linear fit (0,-1),(10,20)


# temp_hysterises is the degrees C a device must drop
# before it will change to a lower control output
temp_hysteresis: &temp_hysteresis 5

power_rail_sensors:
  - channel_name: GFX
    nice_name: P_GFX
    sensor_time_avg: 24
  - channel_name: APC0 Cores
    nice_name: P_APC0
    sensor_time_avg: 24
  - channel_name: APC1 Cores
    nice_name: P_APC1
    sensor_time_avg: 24
  - channel_name: APC2 Cores
    nice_name: P_APC2
    sensor_time_avg: 24
  - channel_name: VPH
    nice_name: P_VPH
    sensor_time_avg: 24

iiosensors:
  - sensor_name: in_temp_pcba_at_40pin_connector_input
    base_path: /sys/bus/iio/devices/iio:device0/
    nice_name: 40PIN
    C_conversion_factor: 1000

  - sensor_name: in_temp_pcba_at_fan_exhaust_input
    base_path: /sys/bus/iio/devices/iio:device0/
    nice_name: FAN
    C_conversion_factor: 1000

  - sensor_name: in_temp_pcba_at_flash_input
    base_path: /sys/bus/iio/devices/iio:device0/
    nice_name: FLASH
    C_conversion_factor: 1000

  - sensor_name: in_temp_pcba_at_heat_sink_fins_input
    base_path: /sys/bus/iio/devices/iio:device0/
    nice_name: HEATSINK
    C_conversion_factor: 1000

  - sensor_name: in_temp_pcba_at_wifi_input
    base_path: /sys/bus/iio/devices/iio:device0/
    nice_name: WIFI
    C_conversion_factor: 1000

devices:
  - hwmon_name: cpu7_middle_thermal
    nice_name: C7
    max_temp: 95
    temp_hysteresis: *temp_hysteresis
    sensor_name: temp1
    poll_mult: 1
    type: ffquad
    T_threshold: 45
    A_quad: *A_quad_control
    B_quad: *B_quad_control
    C_quad: *C_quad_control
    A_ff: *A_ff_control
    B_ff: *B_ff_control


